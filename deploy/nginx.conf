server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # remoteEntry.js decides which version of this portal the shell loads —
    # rules/2-anexos/H-front.md, rule 4: never cache it.
    location = /remoteEntry.js {
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # lms-api-gateway doesn't exist yet — local-only stand-in so the built
    # image can reach circulation-service without a real gateway in front of it.
    location /api/v1/ {
        proxy_pass http://circulation-service:8080/api/v1/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
    }
}
